services:
  db:
    image: mysql:8.0
    container_name: socialpass-db
    environment:
      MYSQL_DATABASE: gympass_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./database/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialpass-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gympass_db
      DB_USER: root
      DB_PASSWORD: 1234
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: socialpass-web
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
