<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Pass - Cadastro de Academia</title>
  <style>
    :root {
      --azul: #14457a;
      --azul-escuro: #0f3460;
      --fundo: #dbe7f3;
      --card: #ffffff;
      --texto: #1f2937;
      --texto-suave: #6b7280;
      --borda: #d1d9e6;
      --erro: #dc2626;
      --sucesso: #166534;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      line-height: 1.5;
      min-height: 100vh;
    }

    .site-header {
      background: var(--azul);
      color: #fff;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-rio {
      height: 44px;
      width: auto;
    }

    .divider {
      width: 1px;
      height: 34px;
      background: rgba(255, 255, 255, 0.35);
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .container {
      max-width: 700px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 6px 24px rgba(15, 52, 96, 0.14);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-head {
      text-align: center;
      margin-bottom: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-social-pass {
      height: 36px;
      width: 36px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--azul);
    }

    .subtitulo {
      color: var(--texto-suave);
      font-size: 14px;
      margin-top: 2px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .linha {
      display: flex;
      gap: 16px;
    }

    .linha .campo {
      flex: 1;
    }

    .campo label {
      font-size: 13px;
      font-weight: 700;
      color: var(--azul);
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--texto);
    }

    .campo input:focus,
    .campo select:focus {
      outline: none;
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(20, 69, 122, 0.15);
    }

    .campo input.invalido,
    .campo select.invalido {
      border-color: var(--erro);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }

    .campo small {
      font-size: 12px;
      color: var(--texto-suave);
    }

    .checkboxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 4px 0;
    }

    .checkboxes label,
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      color: var(--texto);
      cursor: pointer;
    }

    .radio-group {
      display: flex;
      gap: 16px;
      padding: 10px 0;
    }

    .btn-cadastrar {
      margin-top: 8px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--azul-escuro);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cadastrar:hover {
      background: var(--azul);
    }

    .btn-cadastrar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .mensagem {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .mensagem.ok {
      background: #dcfce7;
      color: var(--sucesso);
    }

    .mensagem.erro {
      background: #fee2e2;
      color: var(--erro);
    }

    .horario-box {
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 16px;
      background: #f8fbff;
    }

    .horario-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 700px) {
      .horario-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .linha {
        flex-direction: column;
      }

      .checkboxes {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .checkboxes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<header class="site-header">
  <div class="header-inner">
    <img
            src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-rio-M82t1NqNfZ5sGQHjTlDRHWctRK85Sl.png"
            alt="Logo Prefeitura do Rio" class="logo-rio" />
    <span class="divider"></span>
    <div class="header-titles">
      <span>ASSISTENCIA</span>
      <span>SOCIAL</span>
    </div>
  </div>
</header>

<main class="container">
  <form id="form-academia" class="card" novalidate>
    <div class="card-head">
      <div class="brand">
        <img
                src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-social-pass-HSwjsdkJR24ubq4xrUQgU4Dk7zoLKq.png"
                alt="Logo Social Pass" class="logo-social-pass" />
        <h1>Social Pass</h1>
      </div>
      <p class="subtitulo">Cadastro de Academia</p>
    </div>

    <div class="campo">
      <label for="nome">Nome da Academia</label>
      <input type="text" id="nome" placeholder="Ex: Academia Popular Flamengo" required />
      <small>Nome oficial da academia parceira.</small>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número" required />
      </div>
      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" placeholder="Ex: Tijuca" required />
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" placeholder="XXXXX-XXX" maxlength="9" inputmode="numeric" />
      </div>
      <div class="campo">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" placeholder="XX.XXX.XXX/XXXX-XX" maxlength="18" inputmode="numeric" required />
      </div>
    </div>

    <div class="campo">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" placeholder="(21) 99999-9999" required />
    </div>

    <div class="campo">
      <label>Horário de Funcionamento</label>
      <div class="horario-box">
        <div class="horario-grid">
          <div class="campo">
            <label for="diasFuncionamento">Dias de funcionamento</label>
            <select id="diasFuncionamento" required>
              <option value="">Selecione</option>
              <option value="SEGUNDA_A_SEXTA">Segunda a Sexta</option>
              <option value="SEGUNDA_A_SABADO">Segunda a Sábado</option>
              <option value="TODOS_OS_DIAS">Todos os dias</option>
            </select>
          </div>

          <div class="campo">
            <label for="horarioAbertura">Abre às</label>
            <input type="time" id="horarioAbertura" required />
          </div>

          <div class="campo">
            <label for="horarioFechamento">Fecha às</label>
            <input type="time" id="horarioFechamento" required />
          </div>
        </div>
        <small>Informe os dias e os horários usando os campos estruturados.</small>
      </div>
    </div>

    <div class="campo">
      <label>Tipos de Atividade</label>
      <div class="checkboxes">
        <label><input type="checkbox" name="tipo" value="Musculacao"> Musculação</label>
        <label><input type="checkbox" name="tipo" value="Funcional"> Funcional</label>
        <label><input type="checkbox" name="tipo" value="Ginastica"> Ginástica</label>
        <label><input type="checkbox" name="tipo" value="Natacao"> Natação</label>
        <label><input type="checkbox" name="tipo" value="Crossfit"> Crossfit</label>
        <label><input type="checkbox" name="tipo" value="Pilates"> Pilates</label>
      </div>
    </div>

    <div class="campo">
      <label>Possui Vestiário?</label>
      <div class="radio-group">
        <label><input type="radio" name="vestiario" value="S"> Sim</label>
        <label><input type="radio" name="vestiario" value="N"> Não</label>
      </div>
    </div>

    <button type="submit" class="btn-cadastrar">
      Cadastrar Academia
    </button>

    <div style="text-align: center; margin-top: 15px; font-size: 14px;">
      <a href="loginacademia.html" style="color: #1a4b8c; text-decoration: none; font-weight: 600;">
        Já possui cadastro de academia? Entrar
      </a>
    </div>

    <p id="mensagem" class="mensagem" hidden></p>
  </form>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var API_BASE_URL = "http://localhost:8080";

    if (window.location.port === "8080") {
      API_BASE_URL = window.location.origin;
    }

    var form = document.getElementById("form-academia");
    var mensagem = document.getElementById("mensagem");
    var botaoSubmit = form.querySelector(".btn-cadastrar");

    aplicarMascaras();

    form.addEventListener("submit", async function (evento) {
      evento.preventDefault();
      limparErrosVisuais();

      var nome = document.getElementById("nome");
      var endereco = document.getElementById("endereco");
      var bairro = document.getElementById("bairro");
      var cep = document.getElementById("cep");
      var cnpj = document.getElementById("cnpj");
      var telefone = document.getElementById("telefone");
      var diasFuncionamento = document.getElementById("diasFuncionamento");
      var horarioAbertura = document.getElementById("horarioAbertura");
      var horarioFechamento = document.getElementById("horarioFechamento");

      var faltando = [];

      validarCampoTexto(nome, "Nome da Academia", faltando);
      validarCampoTexto(endereco, "Endereço", faltando);
      validarCampoTexto(bairro, "Bairro", faltando);
      validarCampoTexto(cnpj, "CNPJ", faltando);
      validarCampoTexto(telefone, "Telefone", faltando);
      validarCampoSelect(diasFuncionamento, "Dias de funcionamento", faltando);
      validarCampoTexto(horarioAbertura, "Horário de abertura", faltando);
      validarCampoTexto(horarioFechamento, "Horário de fechamento", faltando);

      var atividadesSelecionadas = [];
      var checkboxesAtividades = document.querySelectorAll('input[name="tipo"]:checked');
      checkboxesAtividades.forEach(function (cb) {
        atividadesSelecionadas.push(cb.value);
      });

      if (atividadesSelecionadas.length === 0) {
        faltando.push("Tipo de Atividade");
      }

      var vestiarioSelecionado = document.querySelector('input[name="vestiario"]:checked');
      if (!vestiarioSelecionado) {
        faltando.push("Possui Vestiário");
      }

      if (faltando.length > 0) {
        mostrarMensagem("Preencha os campos obrigatórios: " + faltando.join(", "), "erro");
        return;
      }

      if (limparNaoDigitos(cnpj.value).length !== 14) {
        cnpj.classList.add("invalido");
        mostrarMensagem("CNPJ deve conter 14 dígitos.", "erro");
        return;
      }

      var telefoneLimpo = limparNaoDigitos(telefone.value);
      if (telefoneLimpo.length < 10 || telefoneLimpo.length > 11) {
        telefone.classList.add("invalido");
        mostrarMensagem("Telefone inválido.", "erro");
        return;
      }

      var cepLimpo = limparNaoDigitos(cep.value);
      if (cep.value.trim() !== "" && cepLimpo.length !== 8) {
        cep.classList.add("invalido");
        mostrarMensagem("CEP inválido. Informe 8 dígitos.", "erro");
        return;
      }

      if (horarioAbertura.value >= horarioFechamento.value) {
        horarioAbertura.classList.add("invalido");
        horarioFechamento.classList.add("invalido");
        mostrarMensagem("O horário de abertura deve ser menor que o horário de fechamento.", "erro");
        return;
      }

      var payload = {
        nome: nome.value.trim(),
        endereco: endereco.value.trim(),
        bairro: bairro.value.trim(),
        cep: cepLimpo,
        cnpj: limparNaoDigitos(cnpj.value),
        telefone: telefoneLimpo,
        diasFuncionamento: diasFuncionamento.value,
        horarioAbertura: horarioAbertura.value,
        horarioFechamento: horarioFechamento.value,
        possuiVestiario: vestiarioSelecionado.value === "S",
        tipoAtividade: atividadesSelecionadas
      };

      try {
        botaoSubmit.disabled = true;
        botaoSubmit.textContent = "Cadastrando...";

        mostrarMensagem("Enviando cadastro...", "ok");

        var response = await fetch(API_BASE_URL + "/api/academias", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          var erroTexto = "Erro ao cadastrar academia.";

          try {
            var erroBody = await response.json();
            erroTexto = erroBody.message || erroBody.erro || erroBody.detail || erroTexto;

            if (erroBody.errors && Array.isArray(erroBody.errors) && erroBody.errors.length > 0) {
              erroTexto = erroBody.errors[0].defaultMessage || erroTexto;
            }
          } catch (e) {
            try {
              var texto = await response.text();
              if (texto) {
                erroTexto = texto;
              }
            } catch (_) {}
          }

          mostrarMensagem(erroTexto, "erro");
          return;
        }

        mostrarMensagem("Academia cadastrada com sucesso!", "ok");
        form.reset();
      } catch (error) {
        mostrarMensagem(error.message || "Falha ao conectar com o backend.", "erro");
      } finally {
        botaoSubmit.disabled = false;
        botaoSubmit.textContent = "Cadastrar Academia";
      }
    });

    function validarCampoTexto(campo, nomeCampo, faltando) {
      if (!campo.value || campo.value.trim() === "") {
        campo.classList.add("invalido");
        faltando.push(nomeCampo);
      }
    }

    function validarCampoSelect(campo, nomeCampo, faltando) {
      if (!campo.value || campo.value.trim() === "") {
        campo.classList.add("invalido");
        faltando.push(nomeCampo);
      }
    }

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
      mensagem.hidden = false;
    }

    function limparNaoDigitos(valor) {
      return (valor || "").replace(/\D/g, "");
    }

    function limparErrosVisuais() {
      var campos = form.querySelectorAll("input, select");
      campos.forEach(function (campo) {
        campo.classList.remove("invalido");
      });
    }

    function aplicarMascaras() {
      var cepInput = document.getElementById("cep");
      var cnpjInput = document.getElementById("cnpj");
      var telefoneInput = document.getElementById("telefone");

      if (cepInput) {
        cepInput.addEventListener("input", function (e) {
          var valor = limparNaoDigitos(e.target.value).slice(0, 8);

          if (valor.length > 5) {
            valor = valor.replace(/(\d{5})(\d{1,3})/, "$1-$2");
          }

          e.target.value = valor;
        });
      }

      if (cnpjInput) {
        cnpjInput.addEventListener("input", function (e) {
          var valor = limparNaoDigitos(e.target.value).slice(0, 14);

          if (valor.length > 12) {
            valor = valor.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, "$1.$2.$3/$4-$5");
          } else if (valor.length > 8) {
            valor = valor.replace(/(\d{2})(\d{3})(\d{3})(\d{1,4})/, "$1.$2.$3/$4");
          } else if (valor.length > 5) {
            valor = valor.replace(/(\d{2})(\d{3})(\d{1,3})/, "$1.$2.$3");
          } else if (valor.length > 2) {
            valor = valor.replace(/(\d{2})(\d{1,3})/, "$1.$2");
          }

          e.target.value = valor;
        });
      }

      if (telefoneInput) {
        telefoneInput.addEventListener("input", function (e) {
          var valor = limparNaoDigitos(e.target.value).slice(0, 11);

          if (valor.length > 10) {
            valor = valor.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
          } else if (valor.length > 6) {
            valor = valor.replace(/(\d{2})(\d{4,5})(\d{0,4})/, "($1) $2-$3");
          } else if (valor.length > 2) {
            valor = valor.replace(/(\d{2})(\d{0,5})/, "($1) $2");
          }

          e.target.value = valor;
        });
      }
    }
  });
</script>
</body>
</html>
